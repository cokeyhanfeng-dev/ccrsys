log_format ccr_mobile_8090 '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# 在现有 nginx.conf 的 http 块内 include 此文件；后端异机时替换 upstream 地址。
# 把 dist-mobile 内容放到 /var/www/mobile/。本文件不含生产连接信息。
upstream ccr_mobile_backend_8090 {
    server host.docker.internal:8080;
}
server {
    listen 8090;
    server_name _;
    root /var/www;
    index index.html;
    # OA 携票入口可能配置在根路径；跳转保留查询参数，所有路径统一脱敏日志。
    access_log /var/log/nginx/mobile-access.log ccr_mobile_8090;
    add_header Referrer-Policy "no-referrer" always;
    location = / { return 302 /mobile/$is_args$args; }
    location = /mobile { access_log /var/log/nginx/mobile-access.log ccr_mobile_8090; return 302 /mobile/$is_args$args; }
    location ^~ /mobile/api/mobile/ {
        access_log /var/log/nginx/mobile-access.log ccr_mobile_8090;
        proxy_pass http://ccr_mobile_backend_8090/mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /mobile/api/ { access_log /var/log/nginx/mobile-access.log ccr_mobile_8090; return 404; }
    location /mobile/ {
        access_log /var/log/nginx/mobile-access.log ccr_mobile_8090;
        try_files $uri $uri/ /mobile/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location / { return 404; }
}
