# 配置片段：将 environment 下各项合并到现有 services.backend.environment。
# 当前仓库根 docker-compose.yml 已包含这些项，使用新版文件时无需重复添加。
# 也可作为覆盖文件与现有 Compose 合并校验；此文件不单独定义完整应用。
services:
  backend:
    environment:
      # 共用凭证与认证头
      CCR_INTEGRATION_AUTH_APP_ID: "${CCR_INTEGRATION_AUTH_APP_ID:-}"
      CCR_INTEGRATION_AUTH_API_KEY: "${CCR_INTEGRATION_AUTH_API_KEY:-}"
      CCR_INTEGRATION_AUTH_APP_CODE: "${CCR_INTEGRATION_AUTH_APP_CODE:-}"
      CCR_INTEGRATION_AUTH_APP_ID_HEADER: "${CCR_INTEGRATION_AUTH_APP_ID_HEADER:-X-App-Id}"
      CCR_INTEGRATION_AUTH_API_KEY_HEADER: "${CCR_INTEGRATION_AUTH_API_KEY_HEADER:-apikey}"

      # 账号密码认证
      CCR_INTEGRATION_AUTH_ENABLED: "${CCR_INTEGRATION_AUTH_ENABLED:-true}"
      CCR_INTEGRATION_AUTH_URL: "${CCR_INTEGRATION_AUTH_URL:-}"

      # code 单点登录
      CCR_INTEGRATION_AUTH_CODE_ENABLED: "${CCR_INTEGRATION_AUTH_CODE_ENABLED:-false}"
      CCR_INTEGRATION_AUTH_CODE_APP_CODE: "${CCR_INTEGRATION_AUTH_CODE_APP_CODE:-rate-approval}"
      CCR_INTEGRATION_AUTH_CODE_TOKEN_URL: "${CCR_INTEGRATION_AUTH_CODE_TOKEN_URL:-}"
      CCR_INTEGRATION_AUTH_USER_INFO_URL: "${CCR_INTEGRATION_AUTH_USER_INFO_URL:-}"

      # 企业微信消息提醒
      CCR_INTEGRATION_WECHAT_ENABLED: "${CCR_INTEGRATION_WECHAT_ENABLED:-false}"
      CCR_INTEGRATION_WECHAT_URL: "${CCR_INTEGRATION_WECHAT_URL:-}"
