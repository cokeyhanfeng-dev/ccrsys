log_format ccr_mobile_standalone '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# 独立移动站点配置示例；上线时由部署人员替换 upstream 为已开通网络的 CCR 地址。
# 把 dist-mobile 内容放到 /usr/share/nginx/html/mobile/。本文件不含生产连接信息。
upstream ccr_mobile_backend {
    server backend:8080;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # OA 携票入口可能配置在根路径；跳转保留查询参数，所有路径统一脱敏日志。
    access_log /var/log/nginx/access.log ccr_mobile_standalone;
    add_header Referrer-Policy "no-referrer" always;
    location = / { return 302 /mobile/$is_args$args; }
    location = /mobile { access_log /var/log/nginx/access.log ccr_mobile_standalone; return 302 /mobile/$is_args$args; }
    location ^~ /mobile/api/mobile/ {
        access_log /var/log/nginx/access.log ccr_mobile_standalone;
        proxy_pass http://ccr_mobile_backend/mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /mobile/api/ { access_log /var/log/nginx/access.log ccr_mobile_standalone; return 404; }
    location /mobile/ {
        access_log /var/log/nginx/access.log ccr_mobile_standalone;
        try_files $uri $uri/ /mobile/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location / { return 404; }
}
