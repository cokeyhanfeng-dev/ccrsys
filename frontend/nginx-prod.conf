# 生产 nginx:80 跳 443 + 443 反代后端(无证书可先只保留 80 server,去掉 ssl 段)
# 详参 docs/25_生产全量部署手册.md §十一
server {
    listen 80;
    server_name _;
    # 若暂未启用 HTTPS,把下方 443 段合并进本 server 并删除 return 301 即可
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # 后端 API 代理(compose 内网,变量形式避免容器重建后 502)
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存(版本更新后浏览器能拿到新入口);带 hash 静态资源可长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
