log_format ccr_mobile_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # code 回调可能落在任意 PC 路由，访问日志统一去掉查询串和 Referer。
    access_log /var/log/nginx/access.log ccr_mobile_access;

    # 上传附件大小上限:后端 max-file-size=10MB/max-request-size=20MB,nginx 默认 1MB 会 413
    client_max_body_size 20m;

    # 后端 API 代理
    # 使用 Docker 内嵌 DNS + 变量形式的 proxy_pass,后端容器重建(IP 变化)后自动重解析,避免 502
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 移动入口独立构建，同源直接代理到 CCR 后端。
    location ^~ /mobile/api/mobile/ {
        access_log /var/log/nginx/access.log ccr_mobile_access;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $mobile_upstream http://backend:8080;
        rewrite ^/mobile/api/(.*)$ /$1 break;
        proxy_pass $mobile_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /mobile/api/ { access_log /var/log/nginx/access.log ccr_mobile_access; return 404; }
    location = /mobile { access_log /var/log/nginx/access.log ccr_mobile_access; return 302 /mobile/$is_args$args; }
    location /mobile/ {
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log ccr_mobile_access;
        try_files $uri $uri/ /mobile/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存(版本更新后浏览器能拿到新入口);带 hash 的静态资源可长缓存
    location = /index.html {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
