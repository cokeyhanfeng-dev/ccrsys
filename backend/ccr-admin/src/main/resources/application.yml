# 客户贡献度与利率决策系统 · 主配置
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ccr-rate
  profiles:
    active: dev
  # 数据源连接参数外部化(详设 §3.7):额外加载部署侧 config/ 目录同名 profile 文件覆盖(jar 内不包含真实连接参数)。
  # optional: 目录不存在时静默跳过;相对 ./config/ 解析自启动工作目录;可用 --spring.config.additional-location=... 覆盖。
  config:
    additional-location: optional:file:./config/
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # Redis 缓存(§3.6):host/port 可按环境覆盖(docker 内由 SPRING_DATA_REDIS_HOST=redis 注入)
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: "1"
      logic-not-delete-value: "0"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Sa-Token 配置(§5.1 会话活跃超时 2 小时:任意合法请求自动续期;连续 2 小时无操作会话失效强制退出)
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 7200
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Warm-Flow 工作流配置(§4.2)
warm-flow:
  enabled: true
  banner: false
  ui: false
  data-source-type: mysql
  key-type: SnowId19
  logic-delete: true
  logic-delete-value: "2"
  logic-not-delete-value: "0"

# 日志
logging:
  level:
    com.ccr: info
    com.baomidou.mybatisplus: warn

# 缓存配置(§3.6):enabled=false 时缓存全部直查库(Redis 未就绪场景不阻塞业务)
ccr:
  cache:
    enabled: true
    default-ttl-seconds: 300
    ttl-jitter: 0.2
    config:
      refresh-cron: 0 */1 * * * *   # 缓存配置定时兜底刷新(单实例经管理接口已实时生效)
    data:
      refresh-cron: 0 0 * * * *   # 缓存数据定时刷新(默认每小时;遍历启用+数据加载器的精确 key 项调 load 写 Redis,单项失败不阻断)

# 业务参数(代码内均有默认值,以下仅注释说明;需调整时取消注释)
# ccr:
#   snapshot:
#     data-stale-days: 3               # 快照来源数据容忍滞后天数(默认3天,超期BLOCK阻断提交, SnapshotServiceImpl)
#     reconcile-tolerance: 0.01        # 贡献度勾稽容差(TOTAL vs 明细加总,超容差BLOCK)
#   vote:
#     round-timeout-hours: 72          # 表决批次超时(小时),超时按已投票数计票
#     timeout-scan-cron: 0 0 * * * ?   # 表决超时扫描(默认每小时)
#   resolution:
#     effective-days: 180              # 决议有效期(默认生效日起180天)
#   commitment:
#     jobs:
#       daily-cron: 0 0 2 * * ?        # 承诺每日跟踪 Job(默认每天 02:00)
#       expiry-cron: 0 30 2 * * ?      # 承诺到期处理 Job(默认每天 02:30)
#       backfill-cron: 0 0 3 * * ?     # 承诺数据回填 Job(默认每天 03:00)
#       monthly-cron: 0 0 5 1 * * ?    # 承诺月度汇总 Job(默认每月1日 05:00)
#   message:
#     retry-cron: 0 */2 * * * ?        # 消息重发 Job(默认每2分钟)
#     max-retry: 3                     # 消息最大重试次数(默认3次,超过置为 FAILED)
#   outbox:
#     scan-cron: 0/30 * * * * *        # Outbox 事件扫描(默认每30秒)
#     batch-size: 50                   # 单次扫描处理批量(默认50)
#     max-retry: 5                     # 事件最大重试次数(默认5,指数退避 1m/5m/15m/1h/4h/12h,超过置 FAILED 并告警)
