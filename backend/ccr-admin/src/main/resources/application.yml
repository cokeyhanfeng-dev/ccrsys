# 客户贡献度与利率决策系统 · 主配置
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ccr-rate
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: "1"
      logic-not-delete-value: "0"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Warm-Flow 工作流配置(§4.2)
warm-flow:
  enabled: true
  banner: false
  ui: false
  data-source-type: mysql
  key-type: SnowId19
  logic-delete: true
  logic-delete-value: "2"
  logic-not-delete-value: "0"

# 日志
logging:
  level:
    com.ccr: info
    com.baomidou.mybatisplus: warn

# 业务参数(代码内均有默认值,以下仅注释说明;需调整时取消注释)
# ccr:
#   snapshot:
#     data-stale-days: 7               # 快照来源数据容忍滞后天数(默认7天, SnapshotServiceImpl)
#   commitment:
#     jobs:
#       daily-cron: 0 0 2 * * ?        # 承诺每日跟踪 Job(默认每天 02:00)
#       expiry-cron: 0 30 2 * * ?      # 承诺到期处理 Job(默认每天 02:30)
#       backfill-cron: 0 0 3 * * ?     # 承诺数据回填 Job(默认每天 03:00)
#       monthly-cron: 0 0 5 1 * * ?    # 承诺月度汇总 Job(默认每月1日 05:00)
#   message:
#     retry-cron: 0 */2 * * * ?        # 消息重发 Job(默认每2分钟)
#     max-retry: 3                     # 消息最大重试次数(默认3次,超过置为 FAILED)
