# 生产环境配置(jar 内为占位模板:host/密码均为占位符;真实连接参数由部署侧 config/application-prod.yml 覆盖,不进代码库/镜像,详设 §3.7)
# 连接池:prod 大池
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://prod-db-host:3306/ccr_rate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ccr_prod
    password: <REPLACE_ME>
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

# Mini-App 授信决议 API 网关集成（真实地址与凭证由部署环境注入）
ccr:
  integration:
    credit-resolution:
      enabled: ${CCR_INTEGRATION_CREDIT_RESOLUTION_ENABLED:false}
      base-url: ${CCR_INTEGRATION_CREDIT_RESOLUTION_GATEWAY_BASE_URL:}
      token-path: ${CCR_INTEGRATION_CREDIT_RESOLUTION_TOKEN_PATH:/miniapp/auth/token}
      latest-path: ${CCR_INTEGRATION_CREDIT_RESOLUTION_LATEST_PATH:/miniapp/creditResolution/ccr/latest}
      exchange-path: ${CCR_INTEGRATION_CREDIT_RESOLUTION_EXCHANGE_PATH:/miniapp/creditResolution/ccr/files/exchange}
      app-id: ${CCR_INTEGRATION_CREDIT_RESOLUTION_APP_ID:}
      api-key: ${CCR_INTEGRATION_CREDIT_RESOLUTION_API_KEY:}
      app-id-header: ${CCR_INTEGRATION_CREDIT_RESOLUTION_APP_ID_HEADER:X-App-Id}
      api-key-header: ${CCR_INTEGRATION_CREDIT_RESOLUTION_API_KEY_HEADER:apikey}
      allowed-download-hosts: ${CCR_INTEGRATION_CREDIT_RESOLUTION_ALLOWED_DOWNLOAD_HOSTS:}
