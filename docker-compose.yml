# 客户贡献度与利率决策系统 · 一键开发环境
# 组成: MySQL 8(自动执行 DDL)/ 后端(Spring Boot 3)/ 前端(Nginx+Vue3)
# 使用: docker compose up -d --build
# 访问: 前端 http://localhost:3000  后端健康检查 http://localhost:8080/health
services:
  mysql:
    image: mysql:8.0
    container_name: ccr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ccr_rate
      TZ: Asia/Shanghai
      # 修复 initdb 中文种子乱码:mysql 客户端按 locale 决定字符集,默认 POSIX 会退化为 latin1
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行全部 DDL(字母序:01->10)
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ccr-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "16379:6379"

  backend:
    build: ./backend
    container_name: ccr-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # 数据源连接参数外部化(详设 §3.7):不再注入 SPRING_DATASOURCE_* 环境变量,
      # 由下方挂载的 ./config 外部配置(容器内 URL 指向服务名 mysql)覆盖 jar 内配置。
      # Redis 缓存(§3.6):容器内通过服务名 redis
      SPRING_DATA_REDIS_HOST: redis
      TZ: Asia/Shanghai
    volumes:
      - ./config:/app/config
      # 运行日志监控:后端日志文件(ccr-run.log)落盘到宿主机 logs/,运维可直接查看
      - ./logs:/app/logs
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: ccr-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
