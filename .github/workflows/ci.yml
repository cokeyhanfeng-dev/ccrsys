name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (JDK 17 / Maven)
    runs-on: ubuntu-latest
    env:
      # Only used by the optional SonarQube step; empty when secrets are not configured.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository (~/.m2/repository)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml', 'backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven (package, runs unit tests)
        run: cd backend && mvn -B package

      - name: SonarQube static analysis (optional)
        if: env.SONAR_TOKEN != ''
        run: cd backend && mvn -B -DskipTests org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar

  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies (~/.npm)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build (vite build)
        run: cd frontend && npm run build
