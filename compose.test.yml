name: ccrsys-test

services:
  mysql:
    image: ccrsys-test-mysql:8.0.44
    build:
      context: ./scripts/dev
      dockerfile: mysql/Dockerfile.test
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ccr_rate
      TZ: Asia/Taipei
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "127.0.0.1:23306:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
      - ./db:/opt/ccrsys/db:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ccr_rate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      CCR_EXTERNAL_MOCK_ENABLED: "true"
      CCR_INTEGRATION_CREDIT_RESOLUTION_ENABLED: "${CCR_INTEGRATION_CREDIT_RESOLUTION_ENABLED:-false}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_GATEWAY_BASE_URL: "${CCR_INTEGRATION_CREDIT_RESOLUTION_GATEWAY_BASE_URL:-}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_TOKEN_PATH: "${CCR_INTEGRATION_CREDIT_RESOLUTION_TOKEN_PATH:-/auth/token}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_LATEST_PATH: "${CCR_INTEGRATION_CREDIT_RESOLUTION_LATEST_PATH:-/miniapp/creditResolution/ccr/latest}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_EXCHANGE_PATH: "${CCR_INTEGRATION_CREDIT_RESOLUTION_EXCHANGE_PATH:-/miniapp/creditResolution/ccr/files/exchange}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_API_KEY: "${CCR_INTEGRATION_CREDIT_RESOLUTION_API_KEY:-}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_SECRET: "${CCR_INTEGRATION_CREDIT_RESOLUTION_SECRET:-}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_API_KEY_HEADER: "${CCR_INTEGRATION_CREDIT_RESOLUTION_API_KEY_HEADER:-apikey}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_SECRET_HEADER: "${CCR_INTEGRATION_CREDIT_RESOLUTION_SECRET_HEADER:-secret}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_TOKEN_FALLBACK_TTL_SECONDS: "${CCR_INTEGRATION_CREDIT_RESOLUTION_TOKEN_FALLBACK_TTL_SECONDS:-14400}"
      CCR_INTEGRATION_CREDIT_RESOLUTION_ALLOWED_DOWNLOAD_HOSTS: "${CCR_INTEGRATION_CREDIT_RESOLUTION_ALLOWED_DOWNLOAD_HOSTS:-}"
      TZ: Asia/Taipei
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:13000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-test-data:
